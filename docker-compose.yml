# Singapore Open Data MCP Server - Docker Compose
# Self-hosted on the VPS at https://mcp.techmavie.digital/datagovsg/mcp
# See deploy/DEPLOYMENT.md for first-time setup.

services:
  mcp-datagovsg:
    build: .
    container_name: mcp-datagovsg
    restart: unless-stopped
    ports:
      # Localhost only: nginx on the host proxies /datagovsg/ to this port
      - "127.0.0.1:8096:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      # Analytics backup + data.gov.sg catalogue index (survives rebuilds)
      - datagovsg-data:/app/data
      - ./.credentials:/app/.credentials:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      # Shared with mcp-key-service, reachable as http://mcp-key-service:8090
      - mcp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mcp-network:
    external: true

volumes:
  datagovsg-data:
    driver: local
