# Nginx location block for the Singapore Open Data MCP Server
# Add this inside the existing mcp.techmavie.digital server block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Endpoint: https://mcp.techmavie.digital/datagovsg/mcp
# Container: 127.0.0.1:8098 -> 8080 (see docker-compose.yml)
#
# CORS is handled by the app (Express). Do not add CORS headers here:
# duplicated Access-Control-Allow-Origin headers make browsers reject responses.

location /datagovsg/ {
    # Trailing slash strips the /datagovsg prefix before proxying
    proxy_pass http://127.0.0.1:8098/;

    # Required for Streamable HTTP transport
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Streaming responses (SSE)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
